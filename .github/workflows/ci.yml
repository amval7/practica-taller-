name: Continuous Integration

# 1. Triggers (Disparadores): Cuándo se ejecuta el pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 2. Jobs: Trabajos o máquinas virtuales requeridas
jobs:
  test:
    name: Pruebas Unitarias y Cobertura
    runs-on: ubuntu-latest

    steps:
      # Paso A: Clonar el código del repositorio
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # Paso B: Configurar Python 3.11
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Paso C: Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Paso D: Ejecutar pruebas unitarias
      - name: Ejecutar pruebas unitarias con pytest
        run: |
          python -m pytest -v

      # Paso E: Validar cobertura mínima del 80%
      - name: Validar umbral de cobertura (>= 80%)
        run: |
          python -m pytest --cov=main --cov-report=term-missing --cov-fail-under=80